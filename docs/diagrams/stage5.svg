  <text x="380" y="90" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="380" dy="0">Stage 4 prompts</tspan>
    <tspan x="380" dy="20">with their verifiers</tspan>
  </text>
  <text x="250" y="278" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
