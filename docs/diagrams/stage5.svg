    <tspan x="250" dy="20">keep tasks solved 1-7 times in 8</tspan>
  </text>
  <text x="250" y="478" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
