    <tspan x="565" dy="20">(strict checker, cites the gold,</tspan>
    <tspan x="565" dy="20">abstain sentence) − length</tspan>
  </text>
  <text x="407.5" y="678" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="407.5" dy="0">GRPO, DAPO loss, 8 rollouts</tspan>
    <tspan x="407.5" dy="20">ε_high 0.28, no KL, 1 update/batch</tspan>
  </text>
  <text x="217.5" y="868" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="217.5" dy="0">3 verifier holes found (the hack audit</tspan>
    <tspan x="217.5" dy="20">caught one, learned on one task);</tspan>
    <tspan x="217.5" dy="20">each fixed with fixtures</tspan>
  </text>
  <text x="597.5" y="878" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
    <tspan x="597.5" dy="0">stop on entropy collapse (steps 52, 65);</tspan>
    <tspan x="597.5" dy="20">keep checkpoint-25 (best val pass@1)</tspan>
  </text>
  <text x="597.5" y="1078" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="597.5" dy="0">Stage 5 read: sharpening only</tspan>
    <tspan x="597.5" dy="20">→ grpo, grpo-seed1 rejected</tspan>
  </text>
  <text x="597.5" y="1266" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
