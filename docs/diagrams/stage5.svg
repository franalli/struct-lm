    <tspan x="250" dy="20">50 val tasks</tspan>
  </text>
  <text x="565" y="468" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e03131" text-anchor="middle">
