# Ablation B: full-parameter CPT of the same 8B on the same windows and the same 32 sequences per
# step (2 GPUs x micro-batch 2 x accumulation 8 = 149 steps), on 2 x H100 with FSDP2
# (train/configs/fsdp2.yaml). Only the parameterisation differs from cpt.yaml, so the LoRA-vs-full
# gap in domain gain and forgetting is attributable. Reasons: notes/decisions.md (ablations).
#   - fp32 weights (sharded; bf16 compute via FSDP mixed precision): with bf16 weights the Trainer
#     applies AdamW updates to them directly, and a 1e-5 step is below bf16's resolution for most
#     weights. ~8.5B trainable: every language-model weight, embeddings and lm_head included.
#   - adamw_torch_8bit (torchao AdamW8bit): its low-bit states are tensor subclasses built to
#     work with FSDP2's sharded DTensor parameters; bitsandbytes' 8-bit kernels expect plain
#     tensors. Per GPU: ~18 GB fp32 weights + ~17 GB fp32 grads + ~8.5 GB optimizer state, plus
#     activations and the full-vocab logits: ~60-65 GB of 80.
#   - no intermediate checkpoints: a full checkpoint would be ~35 GB of weights plus sharded
#     8-bit optimizer state, for a ~1 h run; the final model is saved (FULL_STATE_DICT).
model:
  init_from: mistralai/Ministral-3-8B-Base-2512
  dtype: float32
  attn_implementation: sdpa

# no lora section: full fine-tuning of the language model (vision tower and projector frozen)

data:
  train: [data/processed/train.jsonl]
  val: data/processed/val.jsonl

run:
  results_dir: results

training:
  output_dir: checkpoints/_train/cpt-8b-full
  run_name: cpt-8b-full
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  per_device_eval_batch_size: 2
  learning_rate: 1.0e-5  # full fine-tuning: ~1/10 of LoRA's 1e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # transformers 5: a float in [0, 1) is a ratio of total steps (~4 steps)
  weight_decay: 0.0
  optim: adamw_torch_8bit
  bf16: true
  gradient_checkpointing: false  # FSDP's activation checkpointing (fsdp2.yaml); the Trainer refuses both
  logging_steps: 1
  eval_strategy: steps
  eval_steps: 25
  save_strategy: "no"  # quoted: bare `no` is YAML 1.1 for False
  report_to: none
  seed: 42
