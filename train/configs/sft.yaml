model:
  init_from: checkpoints/cpt-merged   # python train/merge.py --adapter checkpoints/cpt --out ...
  dtype: bfloat16

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  train: data/sft/train.jsonl
  validation: data/sft/val.jsonl

training:
  output_dir: checkpoints/sft
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_length: 4096
  packing: false
  assistant_only_loss: true
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  report_to: wandb
  run_name: sft
  seed: 42
