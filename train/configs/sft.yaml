model:
  # Stage 2's continuing checkpoint (notes/decisions.md: replay adopted by the ablation rule);
  # a relative path, so /vol/checkpoints/cpt-8b-replay10 when run on Modal with cwd=/vol
  init_from: checkpoints/cpt-8b-replay10
  dtype: bfloat16

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  train: data/sft/train.jsonl
  validation: data/sft/sft_val.jsonl

training:
  output_dir: checkpoints/sft
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # transformers 5: a float in [0, 1) is a ratio of total steps
  max_length: 4096
  packing: false
  assistant_only_loss: true
  bf16: true
  tf32: true  # fp32 matmuls on TF32 tensor cores (decisions.md, numeric precision)
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  report_to: wandb
  run_name: sft
  seed: 42
