model:
  init_from: checkpoints/dpo-merged
  dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  train: data/grpo/train.jsonl

rewards:
  functions: [format_reward, correctness_reward, length_penalty]
  weights: [0.2, 1.0, 0.1]

training:
  output_dir: checkpoints/grpo
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  num_generations: 8             # group size; advantages are relative within a group
  # no max_prompt_length: TRL 0.29 removed it (DPO bounds prompt + completion with max_length,
  # GRPO the completion with max_completion_length); keep prompts short in the data
  max_completion_length: 1024
  temperature: 1.0
  learning_rate: 1.0e-6
  beta: 0.0                      # no KL term (DAPO / Dr. GRPO practice); raise if it drifts
  use_vllm: true
  vllm_mode: colocate
  bf16: true
  tf32: true  # fp32 matmuls on TF32 tensor cores (decisions.md, numeric precision)
  gradient_checkpointing: true
  logging_steps: 5
  log_completions: true
  save_steps: 200
  report_to: wandb
  run_name: grpo
  seed: 42
