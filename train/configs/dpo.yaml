model:
  init_from: checkpoints/sft-merged
  dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  train: data/dpo/train.jsonl
  validation: data/dpo/val.jsonl

training:
  output_dir: checkpoints/dpo
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6          # DPO wants ~10-50x lower LR than SFT
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  beta: 0.1                      # KL strength to the reference; lower = drift further
  loss_type: sigmoid
  max_length: 4096
  max_prompt_length: 2048
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  report_to: wandb
  run_name: dpo
  seed: 42
