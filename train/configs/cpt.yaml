model:
  init_from: mistralai/Ministral-3-8B-Base-2512
  dtype: bfloat16
  attn_implementation: sdpa

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  # CPT injects knowledge: adapt MLPs too, not just attention
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  packed: data/packed/cpt

training:
  output_dir: checkpoints/cpt
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 500
  save_total_limit: 3
  report_to: wandb
  run_name: cpt
  seed: 42
