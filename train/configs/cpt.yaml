# Stage 2 main run: LoRA CPT of the 8B base, one epoch. Reasons: notes/decisions.md (Stage 2
# hyperparameters). Relative paths resolve against the repo root locally and /vol on Modal
# (train/modal_train.py runs with cwd=/vol, whose layout mirrors the repo's).
model:
  init_from: mistralai/Ministral-3-8B-Base-2512
  dtype: bfloat16
  attn_implementation: sdpa  # full causal windows: SDPA already uses its FlashAttention-2 kernel

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  # CPT injects knowledge: adapt MLPs too, not just attention
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'
  # text layers only; bare names / all-linear would also hit the vision tower

data:
  train: [data/processed/train.jsonl]
  val: data/processed/val.jsonl

run:
  results_dir: results

training:
  output_dir: checkpoints/_train/cpt-8b
  run_name: cpt-8b
  num_train_epochs: 1
  # 150-step rule: 4,741 windows / 32 seqs per step = 149 steps (64 at ~40M tokens, 128 at ~80M)
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  per_device_eval_batch_size: 4  # the default 8 doubles the ~26 GB of full-vocab logits
  learning_rate: 1.0e-4  # LoRA wants ~10x full fine-tuning's 1e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # transformers 5: a float in [0, 1) is a ratio of total steps (~4 steps)
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  eval_strategy: steps
  eval_steps: 25
  save_strategy: steps
  save_steps: 50
  save_total_limit: 2
  report_to: none  # the curve is results/runs/<run>/train_log.jsonl
  seed: 42
